asyncapi: 2.6.0
info:
  title: Collection Game WebSocket API
  version: v1
  description: WebSocket events for Collection Game
servers:
  production:
    url: ws://localhost:8080/ws
    protocol: ws
channels:
  /ws:
    subscribe:
      message:
        oneOf:
          - $ref: '#/components/messages/ChatMessage'
          - $ref: '#/components/messages/PvPMatchFound'
          - $ref: '#/components/messages/Notification'
    publish:
      message:
        oneOf:
          - $ref: '#/components/messages/ChatMessage'
components:
  messages:
    ChatMessage:
      name: chat.message
      payload:
        type: object
        properties:
          event:
            type: string
          data:
            type: object
    PvPMatchFound:
      name: pvp.match_found
      payload:
        type: object
        properties:
          event:
            type: string
          data:
            type: object
    Notification:
      name: notification
      payload:
        type: object
        properties:
          event:
            type: string
          data:
            type: object
